name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package-script: package:win
          - name: macOS
            os: macos-latest
            package-script: package:mac
          - name: Linux
            os: ubuntu-latest
            package-script: package:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Package desktop app
        run: bun run --filter @imagent/studio ${{ matrix.package-script }}

      - name: Collect desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-release-assets
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "latest*.yml" \) \
            -print -exec cp {} desktop-release-assets/ \;
          test "$(find desktop-release-assets -type f | wc -l)" -gt 0

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: desktop-release-assets/*
          if-no-files-found: error

  github-release:
    name: GitHub Release assets
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  cli-npm:
    name: CLI npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm version
        run: npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --filter @imagent/cli build

      - name: Smoke test CLI
        run: node apps/cli/dist/cli.js --help

      - name: Publish CLI to npm
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cli
          package_version="$(node -p "require('./package.json').version")"
          if npm view "@imagent/cli@${package_version}" version >/dev/null 2>&1; then
            echo "@imagent/cli@${package_version} is already published; skipping npm publish."
          else
            pack_dir="$(mktemp -d)"
            bun pm pack --destination "${pack_dir}"
            package_file="$(find "${pack_dir}" -maxdepth 1 -name "*.tgz" -print -quit)"
            test -n "${package_file}"

            tar -xOf "${package_file}" package/package.json > "${pack_dir}/package.json"
            node -e '
              const manifest = require(process.argv[1]);
              const dependencyGroups = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
              for (const group of dependencyGroups) {
                for (const [name, version] of Object.entries(manifest[group] ?? {})) {
                  if (typeof version === "string" && /^(catalog|workspace):/.test(version)) {
                    throw new Error(`${group}.${name} was not rewritten before publish: ${version}`);
                  }
                }
              }
            ' "${pack_dir}/package.json"

            # Uses npm Trusted Publishing via GitHub OIDC; no registry token is required.
            npm publish "${package_file}" --access public --provenance
          fi
