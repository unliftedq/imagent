<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>imagine-studio</title>
    <script>
      // No-FOUC theme bootstrapping — applied before React mounts so the
      // initial paint matches the user's preference.
      (function () {
        try {
          var pref =
            localStorage.getItem("imagine-studio.theme") || "system";
          var resolved = pref;
          if (pref === "system") {
            resolved = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
