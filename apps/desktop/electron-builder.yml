appId: com.fpcool.imagent
productName: Imagent
icon: assets/imagent.png
directories:
  output: release
files:
  - dist/**/*
  - assets/imagent.png
  - assets/imagent-macos.png
  - assets/imagent.icns
  - assets/catalog.default.json
  - package.json
extraResources:
  - from: ../../LICENSE
    to: LICENSE
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
mac:
  icon: assets/imagent.icns
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Keep ~/.imagent/ in place between reinstalls so the user's gallery,
  # boards, and config survive an upgrade. Set to true if you want a clean
  # uninstall to wipe data too.
  deleteAppDataOnUninstall: false
