appId: com.fpcool.imagine.studio
productName: Imagine Studio
icon: assets/imagine.png
directories:
  output: release
files:
  - dist/**/*
  - assets/imagine.png
  - assets/imagine-macos.png
  - assets/imagine.icns
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
mac:
  icon: assets/imagine.icns
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Keep ~/.imagine/ in place between reinstalls so the user's gallery,
  # boards, and config survive an upgrade. Set to true if you want a clean
  # uninstall to wipe data too.
  deleteAppDataOnUninstall: false
